<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Join Room — SARA</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="center-page">
<main class="setup-card">
  <span class="eyebrow">YOU'RE INVITED</span>
  <h1>Come on in.<br><em>Our movie is waiting.</em></h1>
  <label>Display name</label>
  <input id="name" placeholder="Your name" autocomplete="off" maxlength="30">
  <label>Room code</label>
  <input id="roomCode" placeholder="ABC123" autocomplete="off" maxlength="6" style="text-transform:uppercase;">
  <button id="joinBtn" class="btn btn-primary" style="width:100%; margin-top:20px;">Join our room →</button>
  <a href="/" style="display:block; text-align:center; font-size:0.8rem; color:var(--text-muted); margin-top:16px;">← Back</a>
</main>
<script>
  document.getElementById('joinBtn').addEventListener('click', () => {
    const name = document.getElementById('name').value.trim() || 'Partner';
    const code = document.getElementById('roomCode').value.trim().toUpperCase();
    if (code) {
      sessionStorage.setItem('sara_name', name);
      window.location.href = `/room?code=${code}`;
    }
  });
</script>
</body>
</html>
